<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" 
        type="image/png"
        href="/img/cozy_corner_logo_circl-loading.png">
    <title>Про нас - Cozy Corner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/bc37180bb1.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="contacts.css">
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        
            /* початковий «виріз» покриває весь екран */
            clip-path: circle(150% at 50% 50%);
            -webkit-clip-path: circle(150% at 50% 50%);
            transition: clip-path 1s ease-out, -webkit-clip-path 1s ease-out;
        }
        
        /* 2) Поставили клас → «виріз» звузився до центру */
        #loading-screen.shrink {
            clip-path: circle(0 at 50% 50%);
            -webkit-clip-path: circle(0 at 50% 50%);
        }
        
        /* Логотип обертається в процесі завантаження */
        .loading-logo img {
            width: 150px;
            animation: spin 1.5s linear infinite;
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }
        
        /* 3) Коли додаємо цей клас — картинка звузиться і згасне */
        .loading-logo img.shrink-logo {
            transform: scale(0);
            opacity: 0;
        }
        
        /* Ключові кадри обертання */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <div class="loading-logo">
            <img src="/img/cozy_corner_logo_circl-loading.png" alt="Logo" id="loading-logo">
        </div>
    </div>    
    
    <header style="position: sticky; top: 0; z-index: 1030;">
        <div id="headerDiv"></div>
    </header>
    
    <main>
        <div class="map">
            <div class="map-container">
                <h2 class="map-header">Наші контакти</h2>
                <div class="map-block">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d755.3238631976983!2d30.516539087176493!3d50.44861576520592!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1suk!2sua!4v1745074448131!5m2!1suk!2sua"
                        width="50%" height="340" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                    <div class="contacts">
                        <div class="direct-contact-container">

                            <ul class="contact-list">
                                <li class="list-item"><i class="fa fa-map-marker fa-2x"><span class="contact-text place">Київ, вулиця Прорізна, 18</span></i></li>
                                
                                <li class="list-item"><i class="fa fa-phone fa-2x"><span class="contact-text phone"><a href="tel:1-212-555-5555" title="Give me a call">(095) 555-5555</a></span></i></li>
                                
                                <li class="list-item"><i class="fa fa-envelope fa-2x"><span class="contact-text gmail"><a href="mailto:#" title="Send me an email">cozycorner@gmail.com</a></span></i></li>
                            </ul>
                    
                            <hr>
                            <ul class="social-media-list">
                                <li><a href="#" target="_blank" class="contact-icon">
                                    <i class="fa fa-facebook-square" aria-hidden="true"></i></a>
                                </li>
                                <li><a href="#" target="_blank" class="contact-icon">
                                    <i class="fab fa-tiktok"></i></a>
                                </li>
                                <li><a href="#" target="_blank" class="contact-icon">
                                    <i class="fa fa-twitter" aria-hidden="true"></i></a>
                                </li>
                                <li><a href="#" target="_blank" class="contact-icon">
                                    <i class="fa fa-instagram" aria-hidden="true"></i></a>
                                </li>       
                            </ul>
                            <hr>
                    </div>
                </div>
            </div>
        </div>

        <div class="gallery" id="Gallery">
            <div class="gallery-container">
                <h2 id="gallery-h2">Фотографії від наших клієнтів</h2>
                <div class="gallery-grid">
                    <img src="/img/gallery/barista.jpg" alt="Barista">
                    <img src="/img/gallery/waiting-room.jpg" alt="Waiting-room">
                    <img src="/img/gallery/lamps.jpg" alt="Lamps">
                    <img src="/img/gallery/workers.jpg" alt="Working">
                    <img src="/img/gallery/smiling-men.jpg" alt="Smiling-men">
                    <img src="/img/gallery/restoraunt-room.jpg" alt="Restoraunt-room">
                    <img src="/img/gallery/cafe.jpg" alt="Cafe">
                    <img src="/img/gallery/big-restoraunt.jpeg" alt="Big-restoraunt">
                    <img src="/img/gallery/cofee-cups.jpg" alt="Coffee-cups">
                </div>
            </div>
        </div>
    </main>

    <footer> 
        <div id="footerDiv"></div>
    </footer>

    <div id="loginModalContainer" style="display: none;"></div>
    <script src="/js/lazy-loader.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
